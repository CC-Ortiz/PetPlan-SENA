spring:
  application:
    name: petplan-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/petplan}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_TLS:true}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  address: 127.0.0.1
  port: 8080
petplan:
  admin-clinicas: ${PETPLAN_ADMIN_CLINICAS:}
  web-url: ${PETPLAN_WEB_URL:http://127.0.0.1:8000}
  mail-from: ${MAIL_FROM_ADDRESS:no-reply@petplan.local}
